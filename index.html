    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function normalizeEntry(name) {
      return String(name || '').trim().toUpperCase().replace(/\s+/g, ' ');
    }

    function normalizeScore(score) {
      let value = String(score || '').trim().toUpperCase();
      value = value.replace(/½/g, '1/2');
      value = value.replace(/\s+/g, '');
      value = value.replace(/CARRY\s*OVER/g, 'C/O');
      value = value.replace(/CARRY-OVER/g, 'C/O');
      if (value === 'CO') value = 'C/O';
      return value;
    }

    function parseScore(score) {
      const normalized = normalizeScore(score);

      if (!value) return { text: '-', type: 'none' };
      if (value === '1') return { text: 'W', type: 'win' };
      if (value === '0') return { text: 'L', type: 'loss' };
      if (value === '1/2' || value === '.5') return { text: 'D', type: 'draw' };
      if (value === 'C/O' || value === 'CO') return { text: 'C/O', type: 'carry' };
      return { text: '-', type: 'none' };
    }

    function assignBadges(fights) {
      const appearances = {};
      fights.forEach(function(fight) {
        ['left', 'right'].forEach(function(sideName) {
          const side = fight[sideName];
          const entry = normalizeEntry(side.entryName);
          if (!entry) {
            side.badge = { text: '-', type: 'none' };
            return;
          }
          if (appearances[entry] === undefined) appearances[entry] = 0;
          const token = parseScore(side.score)[appearances[entry]] || '';
          side.badge = tokenToBadge(token);
          appearances[entry]++;
        });
      });
      return fights;
    }

    function formatFraction(value) {
      if (value === null || value === undefined || value === '') return '-';
      return String(value).replace(/1\s*1\/2/g, '1½').replace(/1\/2/g, '½');
    }

    function formatScore(value) {
      if (value === null || value === undefined || value === '') return '-';
      return String(value).replace(/1\/2/g, '½').replace(/-/g, ' - ');
    }

    function badgeClasses(type) {
      if (type === 'win') return 'badge badge-win';
      if (type === 'loss') return 'badge badge-loss';
      if (type === 'draw') return 'badge badge-draw';
      if (type === 'carry') return 'badge badge-carry';
      return 'badge';
    }

    function statBox(label, value) {
      return `
        <div class="stat-box ${label === 'SCORE' ? 'score-box' : 'result-box'}">
          <div class="stat-label">${label}</div>
          <div class="stat-value">${escapeHtml(value)}</div>
        </div>
      `;
    }

    function createSide(side, position) {
      const badge = side.badge || { text: '-', type: 'none' };
      const sideClass = position === 'left' ? 'competitor-left' : 'competitor-right';
      return `
        <section class="competitor ${sideClass}">
          <div class="entry-line">
            <span class="${badgeClasses(badge.type)}">${escapeHtml(badge.text)}</span>
            <div class="entry-name">${escapeHtml(side.entryName || '-')}</div>
          </div>
          <div class="owner-block">
            <div class="mini-label">OWNER / ADDRESS</div>
            <div class="owner-text">${escapeHtml(side.owner || '-')}</div>
          </div>
          <div class="details-block">
            <div>
              <div class="detail-label">WB</div>
              <div class="mono detail-value">${escapeHtml(side.wb || '-')}</div>
            </div>
            <div>
              <div class="detail-label">WEIGHT</div>
              <div class="mono detail-value">${escapeHtml(side.weight || '-')}</div>
            </div>
          </div>
          <div class="stats-block">
            ${statBox('SCORE', formatScore(side.score))}
            ${statBox('RESULT', formatFraction(side.result))}
          </div>
        </section>
      `;
    }

    function createFightCard(fight, total) {
      const fightNo = fight.fightNumber || '-';
      const searchText = [fightNo, fight.left.entryName, fight.left.owner, fight.right.entryName, fight.right.owner]
        .join(' ')
        .toLowerCase();
      return `
        <article class="fight-card" data-search="${escapeHtml(searchText)}">
          <div class="fight-header">
            <div class="gold-line"></div>
            <div class="decor-shape"></div>
            <div class="fight-title">FIGHT #${escapeHtml(fightNo)}<span class="title-rule"></span></div>
            <div class="elim-pill">3RD ELIM</div>
          </div>
          <div class="fight-grid">
            <div class="center-divider"></div>
            <div class="vs-pill">VS</div>
            ${createSide(fight.left, 'left')}
            ${createSide(fight.right, 'right')}
          </div>
          <footer class="fight-footer">
            <div class="gold-line"></div>
            <div class="footer-text">FIGHT ${escapeHtml(fightNo)} OF ${total}</div>
          </footer>
        </article>
      `;
    }

    function renderFights(fights) {
      const list = document.getElementById('fightCards');
      const empty = document.getElementById('emptyState');
      if (!fights || !fights.length) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      const total = fights.length;
      list.innerHTML = fights.map(function(fight) {
        return createFightCard(fight, total);
      }).join('');
      syncHeaderSpace();
      renderSummary(fights);
      applySearch();
      scheduleCardAlignment();
    }

    function summarizeEntries(fights) {
      const summary = {};

      fights.forEach(function(fight) {
        ['left', 'right'].forEach(function(sideName) {
          const side = fight[sideName];
          const name = normalizeEntry(side.entryName);

          if (!name) {
            return;
          }

          if (!summary[name]) {
            summary[name] = {
              name: side.entryName,
              win: 0,
              lose: 0,
              carry: 0,
              points: 0
            };
          }

          if (side.badge && side.badge.type === 'win') {
            summary[name].win++;
            summary[name].points += 1;
          }

          if (side.badge && side.badge.type === 'loss') {
            summary[name].lose++;
          }

          if (side.badge && side.badge.type === 'draw') {
            summary[name].points += 0.5;
          }

          if (side.badge && side.badge.type === 'carry') {
            summary[name].carry++;
          }
        });
      });

      return Object.keys(summary)
        .map(function(key) {
          return summary[key];
        })
        .sort(function(a, b) {
          return a.name.localeCompare(b.name);
        });
    }

    function formatSummaryTotal(row) {
      let total = String(row.points);

      if (row.points % 1 === 0.5) {
        total = Math.floor(row.points)
          ? Math.floor(row.points) + ' 1/2'
          : '1/2';
      }

      if (row.carry) {
        total += 'CO';
      }

      return total;
    }

    function renderSummary(fights) {
      const summaryView = document.getElementById('summaryView');
      const rows = summarizeEntries(fights);

      summaryView.innerHTML = `
        <div class="summary-table" role="table">
          <div class="summary-row summary-head" role="row">
            <div role="columnheader">Entry Name</div>
            <div class="summary-number-head" role="columnheader">Win</div>
            <div class="summary-number-head" role="columnheader">Lose</div>
            <div class="summary-number-head" role="columnheader">C/O</div>
            <div class="summary-number-head" role="columnheader">Total</div>
          </div>
          ${rows.map(function(row) {
            const searchText = row.name.toLowerCase();

            return `
              <div class="summary-row" role="row" data-search="${escapeHtml(searchText)}">
                <div class="summary-entry" role="cell">${escapeHtml(row.name)}</div>
                <div class="summary-number summary-win" role="cell">${row.win}</div>
                <div class="summary-number summary-lose" role="cell">${row.lose}</div>
                <div class="summary-number summary-carry" role="cell">${row.carry}</div>
                <div class="summary-number" role="cell">${escapeHtml(formatSummaryTotal(row))}</div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function setView(view) {
      currentView = view;

      document.getElementById('fightCards').classList.toggle('hidden', view !== 'cards');
      document.getElementById('summaryView').classList.toggle('hidden', view !== 'summary');

      const toggle = document.getElementById('viewToggle');
      toggle.classList.toggle('is-active', view === 'summary');
      toggle.setAttribute('aria-label', view === 'summary' ? 'Show fight cards' : 'Show entry summary');
      toggle.setAttribute('title', view === 'summary' ? 'Fight cards' : 'Entry summary');

      applySearch();
      syncHeaderSpace();
      scheduleCardAlignment();
    }

    function syncHeaderSpace() {
      const header = document.querySelector('.page-header');
      if (!header) return;
      document.documentElement.style.setProperty('--header-height', header.offsetHeight + 'px');
    }

    function alignEntryRows() {
      const sectionSelectors = [
        '.entry-line',
        '.owner-block',
        '.details-block',
        '.stats-block'
      ];

      document.querySelectorAll('.fight-card').forEach(function(card) {
        sectionSelectors.forEach(function(selector) {
          const sections = card.querySelectorAll(selector);
          let maxHeight = 0;

          sections.forEach(function(section) {
            section.style.minHeight = '0';
          });

          sections.forEach(function(section) {
            maxHeight = Math.max(maxHeight, section.getBoundingClientRect().height);
          });

          sections.forEach(function(section) {
            section.style.minHeight = Math.ceil(maxHeight) + 'px';
          });
        });
      });
    }

    function scheduleCardAlignment() {
      window.requestAnimationFrame(function() {
        alignEntryRows();

        window.requestAnimationFrame(function() {
          alignEntryRows();
        });
      });
    }

    function applySearch() {
      const query = document.getElementById('fightSearch').value.trim().toLowerCase();
      const selector = currentView === 'summary'
        ? '#summaryView .summary-row:not(.summary-head)'
        : '#fightCards > article';
      const items = document.querySelectorAll(selector);
      let visible = 0;

      items.forEach(function(item) {
        const matches = !query || item.dataset.search.includes(query);
        item.classList.toggle('hidden', !matches);

        if (matches) {
          visible++;
        }
      });

      document.getElementById('emptyState').classList.toggle('hidden', visible > 0);
    }

    document.getElementById('fightSearch').addEventListener('input', applySearch);

    document.getElementById('viewToggle').addEventListener('click', function() {
      setView(currentView === 'cards' ? 'summary' : 'cards');
    });

    function showLoadError(message) {
      document.getElementById('fightCards').innerHTML = '';
      const empty = document.getElementById('emptyState');
      empty.textContent = message;
      empty.classList.remove('hidden');
      syncHeaderSpace();
    }

    function loadAppsScriptData() {
      const callbackName =
        'loadFightCards_' + Date.now();

      const script =
        document.createElement('script');

      window[callbackName] = function(data) {
        delete window[callbackName];
        script.remove();

        if (!data.ok || !data.fights) {
          return;
        }

        allFights =
          assignBadges(data.fights);

        renderFights(allFights);
      };

      script.onerror = function() {
        delete window[callbackName];
        script.remove();
      };

      script.src =
        APPS_SCRIPT_URL +
        '?callback=' +
        encodeURIComponent(callbackName) +
        '&cacheBust=' +
        Date.now();

      document.body.appendChild(script);
    }

    function loadFights() {
      allFights = assignBadges(FALLBACK_FIGHTS.map(function(fight) {
        return JSON.parse(JSON.stringify(fight));
      }));
      renderFights(allFights);

      if (!APPS_SCRIPT_URL) {
        return;
      }

      loadAppsScriptData();
    }

    loadFights();

    if (document.fonts) {
      document.fonts.ready.then(scheduleCardAlignment);
    }

    window.addEventListener('resize', function() {
      syncHeaderSpace();
      scheduleCardAlignment();
    });
  </script>
</body>
</html>
